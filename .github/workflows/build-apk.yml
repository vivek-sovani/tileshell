name: Build APK

# Builds the debug APK on every push and on manual dispatch, then publishes it
# as a downloadable workflow artifact (Actions run → Artifacts → tileshell-debug-apk).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `android-actions/setup-android@v3` is deliberately not used here — it
      # unconditionally runs `sdkmanager tools`, but Google removed the legacy
      # standalone "tools" package from the SDK repository years ago, so that
      # step always fails with exit code 1 (confirmed via `gh run view --log-
      # failed`: "Warning: Failed to find package 'tools'"), failing every
      # single build regardless of any app change. GitHub's ubuntu-latest
      # runner does ship the Android SDK/cmdline-tools preinstalled, but NOT
      # on PATH by default (a first attempt at just deleting this step
      # entirely still failed CI, with "sdkmanager: command not found" — the
      # broken action was also this workflow's only source of that PATH
      # export). Locating cmdline-tools' own bin/ dynamically (rather than
      # hardcoding today's runner image version, e.g. "16.0") avoids a repeat
      # of the same class of failure the next time GitHub bumps that version.
      - name: Set up Android SDK PATH
        run: |
          CMDLINE_TOOLS_BIN=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type d -name bin | sort -V | tail -1)
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tileshell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
