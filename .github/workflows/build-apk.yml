name: Build APK

# Builds the debug APK on every push and on manual dispatch, then publishes it
# as a downloadable workflow artifact (Actions run → Artifacts → tileshell-debug-apk).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `android-actions/setup-android@v3` is deliberately not used here — it
      # unconditionally runs `sdkmanager tools`, but Google removed the legacy
      # standalone "tools" package from the SDK repository years ago, so that
      # step always fails with exit code 1 (confirmed via `gh run view --log-
      # failed`: "Warning: Failed to find package 'tools'"), failing every
      # single build regardless of any app change. GitHub's ubuntu-latest
      # runner already ships with the Android SDK and cmdline-tools
      # preinstalled (sdkmanager is already on PATH), so no setup step is
      # needed at all — going straight to installing the one platform this
      # build actually needs.
      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tileshell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
